name: CI-CD-MicroSite

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build-test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm ci

    - name: Run Lint
      run: npm run lint

    - name: Run Tests
      run: npm test

    - name: Build Site
      run: npm run build

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

  deploy:

    needs: build-test

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

      - name: Deploy Site
        uses: actions/deploy-pages@v4
